# GitHub Pages へのデプロイ。main への push で発火（手動実行も可）。
#
# 事前設定（リポジトリ側で1回だけ）:
#   Settings → Pages → Build and deployment → Source を「GitHub Actions」にする
#
# アクセス計測のIDは任意。Settings → Secrets and variables → Actions → Variables に
#   PUBLIC_GA_MEASUREMENT_ID / PUBLIC_CF_BEACON_TOKEN
# を入れたときだけビルドに渡る。未設定なら空文字のままビルドが通り、計測タグは出力されない。
#
# 外部アクションはタグではなくコミットSHAで固定している（タグの付け替えで中身が変わらないように）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build, and upload
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
